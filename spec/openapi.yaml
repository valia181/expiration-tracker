openapi: 3.0.3
info:
  title: Expiration Date Monitoring API
  description: REST API specification for the Expiration Date Monitoring System based on approved requirements.
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /items:
    get:
      summary: Get all items
      description: Returns an array of item objects sorted chronologically by expiration date.
      parameters:
        - name: search
          in: query
          description: Filter items by title
          required: false
          schema:
            type: string
        - name: category
          in: query
          description: Filter items by category
          required: false
          schema:
            type: string
            enum: [Food, Medicine, Cosmetics, Chemicals]
      responses:
        '200':
          description: Successfully retrieved the list of items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Item'
        '400':
          description: Invalid category provided for filtering
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create a new item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemInput'
      responses:
        '201':
          description: Item successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          description: Validation error (e.g., empty title or invalid date format)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /items/{id}:
    delete:
      summary: Delete an item
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the item to delete
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Item successfully deleted
        '404':
          description: Item with the specified identifier not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /settings:
    get:
      summary: Get global settings
      responses:
        '200':
          description: Successfully retrieved settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
    put:
      summary: Update global settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Settings'
      responses:
        '200':
          description: Settings successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '400':
          description: Unsupported value provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /backups/export:
    post:
      summary: Export database
      responses:
        '200':
          description: Export completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupData'
        '500':
          description: Error during backup generation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /backups/import:
    post:
      summary: Import database
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackupData'
      responses:
        '200':
          description: Import successfully completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Database successfully restored.
        '400':
          description: Invalid file format or corrupted structure provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    ItemInput:
      type: object
      required:
        - title
        - expirationDate
        - category
      properties:
        title:
          type: string
          minLength: 1
          description: Item title (cannot be empty)
        expirationDate:
          type: string
          format: date
          description: Date in YYYY-MM-DD format
        category:
          type: string
          enum: [Food, Medicine, Cosmetics, Chemicals]
        storageLocation:
          type: string
          description: Storage location of the item
    Item:
      type: object
      required:
        - id
        - title
        - expirationDate
        - category
        - statusColor
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        expirationDate:
          type: string
          format: date
        category:
          type: string
          enum: [Food, Medicine, Cosmetics, Chemicals]
        storageLocation:
          type: string
        statusColor:
          type: string
          enum: [Red, Orange, Green]
          description: Current status of the item (read-only)
    Settings:
      type: object
      required:
        - notificationLeadTime
      properties:
        notificationLeadTime:
          type: integer
          enum: [1, 3, 7, 14]
          description: Number of days for advance notification
    BackupData:
      type: object
      required:
        - settings
        - items
      properties:
        settings:
          $ref: '#/components/schemas/Settings'
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'
    ErrorResponse:
      type: object
      required:
        - timestamp
        - status
        - error
        - message
        - path
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string