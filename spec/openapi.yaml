openapi: 3.0.3
info:
  title: Expiration Date Monitoring API
  description: REST API specification for the Expiration Date Monitoring System based on approved requirements.
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /items:
    get:
      summary: Get all items
      description: Returns an array of item objects sorted chronologically by expiration date.
      parameters:
        - name: search
          in: query
          description: Filter items by title
          required: false
          schema:
            type: string
          example: "Aspirin"
        - name: category
          in: query
          description: Filter items by category
          required: false
          schema:
            type: string
            enum: [Food, Medicine, Cosmetics, Chemicals]
          example: "Medicine"
      responses:
        '200':
          description: Successfully retrieved the list of items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Item'
        '400':
          description: Invalid category provided for filtering
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: "2026-10-09T17:05:00Z"
                status: 400
                error: "Bad Request"
                message: "Validation error: Invalid category 'Toys'. Allowed categories are Food, Medicine, Cosmetics, Chemicals."
                path: "/api/v1/items"
    post:
      summary: Create a new item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemInput'
      responses:
        '201':
          description: Item successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          description: Validation error (e.g., empty title or invalid date format)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                EmptyTitle:
                  summary: Empty title validation error
                  value:
                    timestamp: "2026-10-09T17:05:00Z"
                    status: 400
                    error: "Bad Request"
                    message: "Validation error: 'title' cannot be empty."
                    path: "/api/v1/items"
                InvalidDate:
                  summary: Invalid date format error
                  value:
                    timestamp: "2026-10-09T17:05:00Z"
                    status: 400
                    error: "Bad Request"
                    message: "Validation error: 'expirationDate' must be a valid calendar date in YYYY-MM-DD format."
                    path: "/api/v1/items"
  /items/{id}:
    delete:
      summary: Delete an item
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the item to delete
          schema:
            type: string
            format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
      responses:
        '204':
          description: Item successfully deleted
        '404':
          description: Item with the specified identifier not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: "2026-10-09T17:10:00Z"
                status: 404
                error: "Not Found"
                message: "Item with ID '123e4567-e89b-12d3-a456-426614174000' was not found."
                path: "/api/v1/items/123e4567-e89b-12d3-a456-426614174000"
  /settings:
    get:
      summary: Get global settings
      responses:
        '200':
          description: Successfully retrieved settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
    put:
      summary: Update global settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Settings'
      responses:
        '200':
          description: Settings successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '400':
          description: Unsupported value provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: "2026-10-09T17:15:00Z"
                status: 400
                error: "Bad Request"
                message: "Validation error: 'notificationLeadTime' must be one of [1, 3, 7, 14]."
                path: "/api/v1/settings"
  /backups/export:
    post:
      summary: Export database
      responses:
        '200':
          description: Export completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupData'
        '500':
          description: Error during backup generation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: "2026-10-09T17:20:00Z"
                status: 500
                error: "Internal Server Error"
                message: "Failed to generate database backup due to a file system error."
                path: "/api/v1/backups/export"
  /backups/import:
    post:
      summary: Import database
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackupData'
      responses:
        '200':
          description: Import successfully completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Database successfully restored."
        '400':
          description: Invalid file format or corrupted structure provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: "2026-10-09T17:25:00Z"
                status: 400
                error: "Bad Request"
                message: "Invalid backup file: missing required 'settings' object."
                path: "/api/v1/backups/import"

components:
  schemas:
    ItemInput:
      type: object
      required:
        - title
        - expirationDate
        - category
      properties:
        title:
          type: string
          minLength: 1
          description: Item title (cannot be empty)
          example: "Aspirin"
        expirationDate:
          type: string
          format: date
          description: Date in YYYY-MM-DD format
          example: "2027-01-01"
        category:
          type: string
          enum: [Food, Medicine, Cosmetics, Chemicals]
          example: "Medicine"
        storageLocation:
          type: string
          description: Storage location of the item
          example: "First Aid Kit"
    Item:
      type: object
      required:
        - id
        - title
        - expirationDate
        - category
        - statusColor
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        title:
          type: string
          example: "Aspirin"
        expirationDate:
          type: string
          format: date
          example: "2027-01-01"
        category:
          type: string
          enum: [Food, Medicine, Cosmetics, Chemicals]
          example: "Medicine"
        storageLocation:
          type: string
          example: "First Aid Kit"
        statusColor:
          type: string
          enum: [Red, Orange, Green]
          description: Current status of the item (read-only)
          example: "Green"
    Settings:
      type: object
      required:
        - notificationLeadTime
      properties:
        notificationLeadTime:
          type: integer
          enum: [1, 3, 7, 14]
          description: Number of days for advance notification
          example: 7
    BackupData:
      type: object
      required:
        - settings
        - items
      properties:
        settings:
          $ref: '#/components/schemas/Settings'
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'
    ErrorResponse:
      type: object
      required:
        - timestamp
        - status
        - error
        - message
        - path
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2026-10-09T17:00:00Z"
        status:
          type: integer
          example: 400
        error:
          type: string
          example: "Bad Request"
        message:
          type: string
          example: "Validation error occurred."
        path:
          type: string
          example: "/api/v1/items"